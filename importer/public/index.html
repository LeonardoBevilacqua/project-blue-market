<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion Market Importer</title>
    <link href="css/style.css" rel="stylesheet" />
    <script src="./script.js"></script>
  </head>
  <body>
    <h1>Notion Market Importer</h1>
    <hr />

    <fieldset>
      <legend>Dados da nota fiscal</legend>

      <form id="csv-form">
        <label for="itemsCsv">Items no formato CSV</label>
        <textarea id="itemsCsv" name="itemsCsv"></textarea>

        <button id="csvFormButton" type="submit" disabled>Processar</button>
      </form>
    </fieldset>

    <fieldset>
      <legend>Compras</legend>

      <form id="table-form">
        <label for="date">Data:</label>
        <input type="date" id="date" name="date" required />

        <table border="1">
          <thead>
            <tr>
              <th>Item</th>
              <th>Quantidade</th>
              <th>Valor</th>
              <th>Para</th>
              <th>Item</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="5">Insira os dados no formulario acima</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">Total:</td>
              <td colspan="3" id="tableFooterTotal">0,00</td>
            </tr>
          </tfoot>
        </table>

        <button id="tableFormSubmitButton" type="submit" disabled>
          Salvar
        </button>
      </form>
    </fieldset>
  </body>
</html>
